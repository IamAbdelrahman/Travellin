<div class="discounts-container">
  <h2>Add discounts</h2>
  <p class="subtitle">Help your place stand out to get booked faster and earn your first reviews.</p>

  <div class="discount-cards">
    <div class="discount-card" *ngFor="let discount of discounts"
         [class.active]="discount.isActive"
         (click)="toggleDiscount(discount)">
      <div class="discount-header">
        <h3>{{ discount.name }}</h3>
        <div class="discount-badge">{{ discount.percentage }}%</div>
      </div>
      <p class="discount-description">{{ discount.description }}</p>
      <div class="discount-toggle">
        <div class="toggle-switch" [class.active]="discount.isActive">
          <div class="toggle-knob"></div>
        </div>
        <span>{{ discount.isActive ? 'Enabled' : 'Disabled' }}</span>
      </div>
    </div>
  </div>

  <div class="custom-discount" *ngIf="showCustomDiscount">
    <h3>Custom Discount</h3>
    <div class="custom-input">
      <input type="number" [(ngModel)]="customDiscountValue" min="1" max="50" placeholder="Discount %">
      <span>% off for</span>
      <input type="number" [(ngModel)]="customDiscountNights" min="1" placeholder="Nights">
      <span>night stays</span>
      <button class="btn-add" (click)="addCustomDiscount()">Add</button>
    </div>
  </div>

  <button class="btn-more" (click)="toggleCustomDiscount()">
    {{ showCustomDiscount ? 'Hide custom discount' : '+ Add custom discount' }}
  </button>
</div>
