<div class="basics-container">
  <h2>Share some basics about your place</h2>
  <p class="subtitle">You'll add more details later, like bed types.</p>

  <div class="basics-grid">
    <div class="basic-card" *ngFor="let item of basicItems">
      <h3>{{ item.label }}</h3>
      <div class="counter">
        <button (click)="decrement(item.key)" [disabled]="getCount(item.key) <= item.min">
          −
        </button>
        <span>{{ getCount(item.key) }}</span>
        <button (click)="increment(item.key)" [disabled]="getCount(item.key) >= item.max">
          +
        </button>
      </div>
    </div>
  </div>

  <div class="bed-types" *ngIf="showBedTypes">
    <h3>Bed Types</h3>
    <div class="bed-options">
      <div *ngFor="let bed of bedTypes" class="bed-option">
        <label>
          <input type="checkbox"
                 [checked]="selectedBeds.has(bed)"
                 (change)="toggleBedType(bed)">
          <span class="checkmark"></span>
          {{ bed }}
        </label>
      </div>
    </div>
  </div>

  <button class="btn-more" (click)="toggleBedTypes()">
    {{ showBedTypes ? 'Hide bed types' : '+ Add bed types' }}
  </button>
</div>
