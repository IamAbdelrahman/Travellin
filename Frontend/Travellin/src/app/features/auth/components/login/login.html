<div class="login-modal-overlay">
  <div class="login-modal">
    <div class="modal-header">
      <button class="close-btn" (click)="closeLogin()">X</button>
      <h3>Welcome back, Lidiya</h3>
    </div>
    <div class="modal-body">
      <div class="profile-pic">
        <img [src]="profilePic" alt="Profile Picture">
      </div>
      <p class="email-display">lidyarefero.design</p>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" formControlName="email" placeholder="Enter your email"
            [class.invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="error-message">
            Please enter a valid email.
          </div>
        </div>

        <div class="form-group password-group">
          <label for="password">Password</label>
          <input [type]="showPassword ? 'text' : 'password'" id="password" formControlName="password"
            placeholder="Password"
            [class.invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          <button type="button" class="show-hide-btn" (click)="togglePasswordVisibility()">
            {{ showPassword ? 'Hide' : 'Show' }}
          </button>
          <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error-message">
            Password is required.
          </div>
        </div>

        <button type="submit" class="login-btn" [disabled]="loginForm.invalid">Log in</button>
      </form>

      <a href="#" class="forgot-password">Forgot password?</a>
      <div class="separator"></div>
      <a href="#" class="another-account">Not you? Use another account</a>
    </div>
  </div>
</div>
