<div class="location-container">
  <h2>Where's your place located?</h2>
  <p class="subtitle">Your address is only shared with guests after they've made a reservation.</p>

  <div class="location-content">
    <div class="map-container">
      <!-- Google Maps Embed -->
      <div #googleMap class="google-map"></div>
      <div class="map-overlay">
        <button (click)="locateMe()" class="btn-locate">
          <i class="location-icon">📍</i> Use my current location
        </button>
      </div>
    </div>

    <div class="address-section">
      <div class="search-box">
        <input type="text"
               [(ngModel)]="searchQuery"
               (input)="onSearchChange()"
               placeholder="Enter your address">
        <button (click)="searchLocation()" class="btn-search">
          <i class="search-icon">🔍</i>
        </button>
      </div>

      <div class="suggestions" *ngIf="locationSuggestions.length > 0">
        <div *ngFor="let suggestion of locationSuggestions"
             class="suggestion-item"
             (click)="selectLocation(suggestion)">
          {{ suggestion.description }}
        </div>
      </div>

      <div class="address-details" *ngIf="selectedLocation">
        <h3>Selected Location</h3>
        <p>{{ selectedLocation.description }}</p>
        <div class="detail-row">
          <span>Latitude:</span>
          <span>{{ selectedLocation.lat | number:'1.4-4' }}</span>
        </div>
        <div class="detail-row">
          <span>Longitude:</span>
          <span>{{ selectedLocation.lng | number:'1.4-4' }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
