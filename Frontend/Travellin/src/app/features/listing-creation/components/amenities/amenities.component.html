<div class="amenities-container">
  <h2>Tell guests what your place has to offer</h2>
  <p class="subtitle">You can add more amenities after you publish your listing.</p>

  <div class="amenities-section">
    <h3>Guest favorites</h3>
    <div class="amenities-grid">
      <div *ngFor="let amenity of standardAmenities" class="amenity-card">
        <label>
          <input type="checkbox"
                 [checked]="selectedAmenities.has(amenity)"
                 (change)="toggleAmenity(amenity)">
          <span class="checkmark"></span>
          {{ amenity }}
        </label>
      </div>
    </div>
  </div>

  <div class="amenities-section standout-section">
    <h3>Standout amenities</h3>
    <div class="amenity-input">
      <input type="text"
             [(ngModel)]="customAmenity"
             placeholder="e.g., Pool, Sauna, Game Room">
      <button class="btn-add" (click)="addCustomAmenity()">+ Add</button>
    </div>
    <div class="custom-amenities">
      <div *ngFor="let amenity of customAmenities" class="custom-amenity">
        {{ amenity }}
        <button (click)="removeCustomAmenity(amenity)">×</button>
      </div>
    </div>
  </div>
</div>
