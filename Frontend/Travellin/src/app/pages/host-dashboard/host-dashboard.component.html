<div class="host-dashboard">
  <!-- Sidebar -->
  <div class="sidebar" [class.sidebar-collapsed]="!sidebarOpen">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-icon"></div>
        <span *ngIf="sidebarOpen" class="logo-text">Host Panel</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a class="nav-item" [class.active]="activeTab === 'overview'" (click)="setActiveTab('overview')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        <span *ngIf="sidebarOpen">Overview</span>
      </a>

      <a class="nav-item" [class.active]="activeTab === 'properties'" (click)="setActiveTab('properties')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9,22 9,12 15,12 15,22"></polyline>
        </svg>
        <span *ngIf="sidebarOpen">Properties</span>
      </a>

      <a class="nav-item" [class.active]="activeTab === 'bookings'" (click)="setActiveTab('bookings')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        <span *ngIf="sidebarOpen">Bookings</span>
      </a>

      <!-- <a class="nav-item" [class.active]="activeTab === 'reviews'" (click)="setActiveTab('reviews')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <span *ngIf="sidebarOpen">Reviews</span>
      </a> -->
    </nav>
  </div>

  <!-- Main Content -->
  <div class="main-content" [class.main-content-expanded]="!sidebarOpen">
    <!-- Top Bar -->
    <header class="top-bar">
      <div class="top-bar-left">
        <button class="menu-button" (click)="toggleSidebar()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="top-bar-right">
        <!-- Notofication + host profile -->
      </div>
    </header>
    <!-- Content Area -->
    <main class="content-area">

      <div *ngIf="activeTab === 'bookings'" class="tab-content">
        <app-host-booking></app-host-booking>
      </div>
      <div *ngIf="activeTab === 'properties'" class="tab-content">
        <div class="flex justify-end mb-4">
          <button class="btn btn-primary" (click)="toggleAddProperty()">
            {{ showAddProperty ? 'Back to Properties' : 'Add Property' }}
          </button>
        </div>

        <!-- Show Add Property Form if flag is true -->
        <app-add-property *ngIf="showAddProperty"></app-add-property>

        <!-- Show Property List if flag is false -->
        <app-host-property *ngIf="!showAddProperty"></app-host-property>
      </div>


    </main>
  </div>
</div>
