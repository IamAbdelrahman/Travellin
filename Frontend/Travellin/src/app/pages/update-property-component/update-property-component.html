<!-- Backdrop Overlay -->
<div class="modal d-block" role="dialog"
    style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(0, 0, 0, 0.5); z-index: 1050; display: flex; align-items: center; justify-content: center;">

    <!-- Modal Box -->
    <div class="modal-dialog modal-dialog-centered" style="z-index: 1060;">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Edit Property</h5>
                <button type="button" class="btn-close" aria-label="Close" (click)="closePopup()"></button>
            </div>

            <div class="modal-body">
                <form [formGroup]="form" (ngSubmit)="onSubmit()">
                    <div class="form-group mb-3">
                        <label>Title</label>
                        <input formControlName="title" class="form-control" />
                    </div>
                    <div class="form-group mb-3">
                        <label>Price Per Night</label>
                        <input type="number" formControlName="pricePerNight" class="form-control" />
                    </div>
                    <div class="form-group mb-3">
                        <label>Latitude</label>
                        <input type="number" formControlName="latitude" class="form-control" />
                    </div>
                    <div class="form-group mb-3">
                        <label>Longitude</label>
                        <input type="number" formControlName="longitude" class="form-control" />
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" (click)="closePopup()">Close</button>
                        <button type="submit" class="btn " [disabled]="form.invalid || isUpdating"
                            style="background-color: #FF385C; color: white;">
                            {{ isUpdating ? 'Updating...' : 'Update Property' }}
                        </button>
                    </div>
                </form>
            </div>

        </div>
    </div>
</div>
