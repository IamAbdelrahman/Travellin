<!-- Modal -->
<div class="modal fade show d-block" role="dialog" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
             backdrop-filter: blur(2px); z-index: 1050;">

    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Edit Property</h5>
                <button type="button" class="close btn" (click)="closePopup()">
                    <span>&times;</span>
                </button>
            </div>

            <div class="modal-body">
                <form [formGroup]="form" (ngSubmit)="onSubmit()">
                    <div class="form-group mb-3">
                        <label>Title</label>
                        <input formControlName="title" class="form-control" />
                    </div>


                    <div class="form-group mb-3">
                        <label>Price Per Night</label>
                        <input type="number" formControlName="pricePerNight" class="form-control" />
                    </div>

                    <div class="form-group mb-3">
                        <label>Latitude</label>
                        <input type="number" formControlName="latitude" class="form-control" />
                    </div>

                    <div class="form-group mb-3">
                        <label>Longitude</label>
                        <input type="number" formControlName="longitude" class="form-control" />
                    </div>


                    <!-- Add more fields as needed -->

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" (click)="closePopup()">Close</button>
                        <button type="submit" class="btn btn-primary" [disabled]="form.invalid || isUpdating">
                            {{ isUpdating ? 'Updating...' : 'Update Property' }}
                        </button>
                    </div>
                </form>
            </div>

        </div>
    </div>
</div>
