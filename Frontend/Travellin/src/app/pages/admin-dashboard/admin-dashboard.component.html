<!-- admin-dashboard.component.html -->
<div class="admin-dashboard">
  <!-- Sidebar -->
  <div class="sidebar" [class.sidebar-collapsed]="!sidebarOpen">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-icon"></div>
        <span *ngIf="sidebarOpen" class="logo-text">Admin Panel</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a class="nav-item" [class.active]="activeTab === 'overview'" (click)="setActiveTab('overview')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        <span *ngIf="sidebarOpen">Overview</span>
      </a>

      <a class="nav-item" [class.active]="activeTab === 'users'" (click)="setActiveTab('users')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
        <span *ngIf="sidebarOpen">Users</span>
      </a>

      <a class="nav-item" [class.active]="activeTab === 'properties'" (click)="setActiveTab('properties')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9,22 9,12 15,12 15,22"></polyline>
        </svg>
        <span *ngIf="sidebarOpen">Properties</span>
      </a>

      <a class="nav-item" [class.active]="activeTab === 'bookings'" (click)="setActiveTab('bookings')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        <span *ngIf="sidebarOpen">Bookings</span>
      </a>

      <a class="nav-item"  [class.active]="activeTab === 'payments'" (click)="setActiveTab('payments')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
          <line x1="1" y1="10" x2="23" y2="10"></line>
        </svg>
        <span *ngIf="sidebarOpen">Payments</span>
      </a>

      <a class="nav-item"  [class.active]="activeTab === 'reviews'" (click)="setActiveTab('reviews')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <span *ngIf="sidebarOpen">Reviews</span>
      </a>
    </nav>
  </div>

  <!-- Main Content -->
  <div class="main-content" [class.main-content-expanded]="!sidebarOpen">
    <!-- Top Bar -->
    <header class="top-bar">
      <div class="top-bar-left">
        <button class="menu-button" (click)="toggleSidebar()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        
        <div class="search-bar">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
          <input type="text" placeholder="Search..." [(ngModel)]="searchTerm">
        </div>
      </div>

      <div class="top-bar-right">
        <div class="notification-container">
          <button class="notification-button" (click)="toggleNotifications()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <!-- <span class="notification-badge" *ngIf="getUnreadNotificationsCount() > 0">
              {{ getUnreadNotificationsCount() }}
            </span> -->
          </button>

          <!-- Notifications Dropdown -->
          <!-- <div class="notifications-dropdown" *ngIf="showNotifications">
            <div class="notifications-header">
              <h3>Notifications</h3>
            </div>
            <div class="notifications-list">
              <div *ngFor="let notification of notifications" 
                   class="notification-item" 
                   [class.unread]="!notification.read"
                   (click)="markNotificationAsRead(notification)">
                <div class="notification-content">
                  <p>{{ notification.message }}</p>
                  <span class="notification-date">{{ notification.date }}</span>
                </div>
              </div>
            </div>
          </div> -->
        </div>

        <div class="profile-menu">
          <img [src]="adminPhoto" alt="Profile" class="profile-avatar">
          <span>Admin</span>
        </div>
      </div>
    </header>

    <!-- Content Area -->
    <main class="content-area">
      <!-- Overview Tab -->
      <div *ngIf="activeTab === 'overview'" class="tab-content">
        <h1 class="page-title">Dashboard Overview</h1>
        
        <!-- Analytics Cards -->
        <div class="analytics-grid">
          <div *ngFor="let card of analyticsCards" class="analytics-card">
            <div class="card-header">
              <h3>{{ card.title }}</h3>
              <div class="card-icon" [ngClass]="'icon-' + card.icon"></div>
            </div>
            <div class="card-value">{{ card.value }}</div>
            <div class="card-change" [ngClass]="card.changeType">
              {{ card.change }} from last month
            </div>
          </div>
        </div>

        <!-- Charts Section -->
        <div class="charts-section">
          <div class="chart-card">
            <h3>Monthly Bookings Trend</h3>
            <div class="chart-placeholder">
              <div class="chart-bars">
                <div *ngFor="let data of monthlyData" class="chart-bar">
                  <div class="bar" [style.height.px]="data.bookings / 2"></div>
                  <span class="bar-label">{{ data.month }}</span>
                </div>
              </div>
            </div>
          </div>

          <div class="chart-card">
            <h3>Revenue Trend</h3>
            <div class="chart-placeholder">
              <div class="revenue-line">
                <div *ngFor="let data of monthlyData; let i = index" class="revenue-point"
                     [style.left.%]="(i / (monthlyData.length - 1)) * 100"
                     [style.bottom.%]="(data.revenue / 150000) * 100">
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>


      <!-- Users Tab -->
       <div *ngIf="activeTab === 'users'" class="tab-content">
        <app-users-admin (adminPhotoEvent)="receiveAdminPhoto($event)"></app-users-admin>
       </div>
        <!-- [routerLink]="'/admin/users'" routerLinkActive="active"></div> -->
