      <div>
        <div class="page-header">
          <h1 class="page-title">User Management</h1>
          <div class="page-actions">
            <select [(ngModel)]="selectedFilter" (change)="getFilteredUsers()"  class="filter-select">
              <option value="all">All Users</option>
              <option value="host">Hosts</option>
              <option value="guest">Guests</option>
            </select>
          </div>
      </div>
      <div class="data-table">
      <div class="table-responsive shadow-sm rounded-4 overflow-hidden">
        <table class="table align-middle table-hover mb-0">
          <thead class=" table-dark tableHeader">
            <tr class="text-center">
              <th>#</th>
              <th>Photo</th>
              <th>User Name</th>
              <th>Email</th>
              <th>Roles</th>
              <th>Activities</th>
              <th>Actions</th>
            </tr>
          </thead>
    
          <tbody class="table-light">
            <tr *ngFor="let user of filtered; let i = index">
              <td class="fw-semibold">{{ i + 1 }}</td>
              <td>
                <img
                  *ngIf="user.photo?.photoUrl"
                  [src]="user.photo.photoUrl"
                  alt="User Photo"
                  width="50"
                  height="50"
                  class="rounded-circle border border-2 border-secondary"
                  style="object-fit: cover;"
                />
                <span *ngIf="!user.photo?.photoUrl" class="text-muted">No Photo</span>
              </td>
              <td>{{ user.firstName}} {{user.lastName}}</td>
              <td>{{ user.email }}</td>
              <td>
                <span *ngFor="let role of user.roles; let last = last">
                  <span class="badge bg-primary me-1">{{ role }}</span>
                </span>
              </td>
              <td>
                <span class="status-badge" [ngClass]="getStatusColor(user.status)">
                  {{ user.status }}</span>
              </td>
              <td>
                <button 
                class="btn p-1 shadow-sm border-0 bg-transparent dltBtn"
                 (click)="onDelete(user.userId)"
                  title="Delete">
                <fa-icon 
                [icon]="user.status === 'Active' ? icons['trash'] : icons['trash']"
                [ngClass]="user.status === 'Active' ? 'text-danger' : 'text-success'"
                [title]="user.status === 'Active' ? 'This property is already deleted' : 'You can delete this property'"
                ></fa-icon>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      </div>
    </div>
