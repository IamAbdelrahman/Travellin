<!-- search-bar.component.html -->
<div class="search-container">
    <!-- Main Search Bar -->
    <div class="search-bar">

        <!-- Where - Destination -->
        <div class="search-field border-right">
            <label class="field-label">Where</label>
            <input type="text" placeholder="Search destinations" [(ngModel)]="searchData.destination"
                class="field-input" />
        </div>

        <!-- Check in -->
        <div class="search-field border-right">
            <label class="field-label">Check in</label>
            <input type="date" [(ngModel)]="searchData.checkIn" class="field-input date-input" />
        </div>

        <!-- Check out -->
        <div class="search-field border-right">
            <label class="field-label">Check out</label>
            <input type="date" [(ngModel)]="searchData.checkOut" class="field-input date-input" />
        </div>

        <!-- Who - Guests -->
        <div class="search-field">
            <label class="field-label">Who</label>
            <input type="text" placeholder="Add guests" [(ngModel)]="searchData.guests" class="field-input" />
        </div>

        <!-- Search Button -->
        <div class="search-button-container">
            <button (click)="onSearch()" class="search-button">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
            </button>
        </div>
    </div>

    <!-- Filters Button -->
    <div class="filters-button-container">
        <button (click)="toggleFilters()" class="filters-button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="21" x2="14" y1="4" y2="4"></line>
                <line x1="10" x2="3" y1="4" y2="4"></line>
                <line x1="21" x2="12" y1="12" y2="12"></line>
                <line x1="8" x2="3" y1="12" y2="12"></line>
                <line x1="21" x2="16" y1="20" y2="20"></line>
                <line x1="12" x2="3" y1="20" y2="20"></line>
                <circle cx="12" cy="4" r="2"></circle>
                <circle cx="10" cy="12" r="2"></circle>
                <circle cx="14" cy="20" r="2"></circle>
            </svg>
            <span>Filters</span>
        </button>
    </div>

    <!-- Filters Panel -->
    <div *ngIf="showFilters" class="filters-panel">
        <h3 class="filters-title">Filters</h3>

        <div class="filters-grid">
            <!-- Price Range -->
            <div class="filter-group">
                <label class="filter-label">Price Range</label>
                <div class="price-range">
                    <input type="number" placeholder="Min" [(ngModel)]="filterData.minPrice" class="price-input" />
                    <span class="price-separator">-</span>
                    <input type="number" placeholder="Max" [(ngModel)]="filterData.maxPrice" class="price-input" />
                </div>
            </div>

            <!-- Property Type -->
            <div class="filter-group">
                <label class="filter-label">Property Type</label>
                <select [(ngModel)]="filterData.propertyType" class="property-select">
                    <option *ngFor="let type of propertyTypes" [value]="type.value">
                        {{ type.label }}
                    </option>
                </select>
            </div>

            <!-- Amenities -->
            <div class="filter-group">
                <label class="filter-label">Amenities</label>
                <div class="amenities-list">
                    <label *ngFor="let amenity of amenitiesList" class="amenity-item">
                        <input type="checkbox" [checked]="isAmenitySelected(amenity)"
                            (change)="onAmenityChange(amenity, $event)" class="amenity-checkbox" />
                        <span class="amenity-text">{{ amenity }}</span>
                    </label>
                </div>
            </div>
        </div>

        <div class="filters-actions">
            <button (click)="clearFilters()" class="clear-button">
                Clear all
            </button>
            <button (click)="applyFilters()" class="apply-button">
                Apply filters
            </button>
        </div>
    </div>
</div>
